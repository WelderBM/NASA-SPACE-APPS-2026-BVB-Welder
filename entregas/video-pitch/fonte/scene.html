<script>

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fin=(t,a,d=.5)=>ease((t-a)/d);
const fio=(t,a,b,d=.4)=>Math.min(fin(t,a,d),ease((b-t)/d));
const lerp=(a,b,x)=>a+(b-a)*x;
const NS='http://www.w3.org/2000/svg';
let SUBS=[], T={};
// sprouts for scene 3-4 rows
const sp=$('sprouts'); const SP=[];
[[800,60,1160],[880,40,1180],[960,20,1200]].forEach(([y,x0,x1],r)=>{for(let x=x0+40;x<x1;x+=90){const u=document.createElementNS(NS,'use');u.setAttribute('href','#sprout');sp.appendChild(u);SP.push([u,x,y+6,(x-x0)/(x1-x0)*0.6+r*0.12]);}});
const sp5=$('s5sprouts'); const SP5=[];
[[790,1000,1880],[880,990,1890],[970,980,1900]].forEach(([y,x0,x1],r)=>{for(let x=x0+30;x<x1;x+=80){const u=document.createElementNS(NS,'use');u.setAttribute('href','#sprout');sp5.appendChild(u);SP5.push([u,x,y]);}});
// clone rosa for scene 5
const r2=$('rosa').cloneNode(true); r2.removeAttribute('id'); r2.setAttribute('transform','');
r2.querySelectorAll('[id]').forEach(e=>e.setAttribute('id','r2_'+e.id)); $('rosa2holder').appendChild(r2);
function setSubs(s,timing){SUBS=s;T=timing;}
function sub(t){
  let cur=null;
  for(const [txt,a,b] of SUBS){ if(t>=a-0.08 && t<b+0.25){cur=txt;} }
  const box=$('subBox');
  if(t>=T.lines[5][0]-0.1) cur=null;
  if(!cur){box.setAttribute('opacity',0);return;}
  const el=$('sub'); el.textContent=cur.replace(/\.\.\.$/,'…');
  const w=Math.min(1800,el.getComputedTextLength()+80);
  $('subBg').setAttribute('x',960-w/2); $('subBg').setAttribute('width',w);
  box.setAttribute('opacity',1);
}
function render(t){
  const L=T.lines; // [[s,e],...]
  const s2=L[1][0], s3=L[2][0], s4=L[3][0], s5=L[4][0], s6=L[5][0];
  // world visibility
  const worldOn = t < s5+0.3 ? 1 : 0;
  $('world').setAttribute('opacity', t<s5 ? 1 : 1-fin(t,s5,0.35));
  // camera
  let cam;
  if(t<s2){ const k=eio(t/s2); cam=[lerp(1,1.12,k), lerp(0,-160,k), lerp(0,-40,k)]; }
  else if(t<s3){ const k=eio((t-s2)/0.8); cam=[lerp(1.12,1.45,k), lerp(-160,-640,k), lerp(-40,-260,k)]; }
  else if(t<s4){ const k=eio((t-s3)/1.0); cam=[lerp(1.45,1.0,k), lerp(-640,0,k), lerp(-260,0,k)]; }
  else { cam=[1,0,0]; }
  $('world').setAttribute('transform',`translate(${cam[1]},${cam[2]}) scale(${cam[0]})`);
  // sky / ground drying -> wet in scene 4
  const wet=fin(t,s4+2.4,1.6);
  $('skyW').setAttribute('opacity',wet); $('gW').setAttribute('opacity',wet);
  $('cracks').setAttribute('opacity',.8*(1-wet)); $('heat').setAttribute('opacity',.55*(1-fin(t,s3,1)));
  $('heat').setAttribute('transform',`translate(0,${-10*Math.sin(t*3)})`);
  $('sun').setAttribute('r', 230+8*Math.sin(t*2)); $('sun').setAttribute('opacity',1-0.7*wet);
  $('rows').setAttribute('opacity',fin(t,s4+1.8,0.8));
  for(const [u,x,y,d] of SP){ const g=fin(t,s4+2.0+d*2.2,0.6); u.setAttribute('transform',`translate(${x},${y}) scale(${g*1.1})`); u.setAttribute('opacity',g>0.01?1:0);}
  // Rosa idle + blink
  const bob=3*Math.sin(t*2.2);
  const rosaX = t<s4 ? 1180 : lerp(1180,1500,eio((t-s4)/0.8));
  $('rosa').setAttribute('transform',`translate(${rosaX},${715+bob})`);
  const blink = ((t%3.1)<0.12)?0.15:1;
  $('eyeL').setAttribute('ry',9*blink); $('eyeR').setAttribute('ry',9*blink);
  // worried brows in scene 2
  const worry=fio(t,s2-0.2,s3,0.3);
  $('brows').setAttribute('d',`M-34,${-18+worry*-4} l22,${-3+worry*8} M12,${-21+worry*4} l22,${3-worry*8}`);
  const smile = t>s4+2.5 ? 1 : 0;
  $('mouth').setAttribute('d', worry>0.5?'M-14,34 Q0,26 14,34':(smile?'M-20,26 Q0,48 20,26':'M-16,30 Q0,40 16,30'));
  // arms: scratch head in scene 2, raise phone in scene 3
  let armR=0, armL=0;
  if(t>=s2 && t<s3){ armR = -150*fio(t,s2+0.2,s3-0.1,0.4) + 8*Math.sin(t*14)*fio(t,s2+0.6,s3-0.3,0.2); }
  if(t>=s3-0.1 && t<s4+0.2){ armR = -70*fio(t,s3,s4+0.2,0.5); }
  $('armR').setAttribute('transform',`translate(62,-10) rotate(${armR})`);
  const hasPhone = (t>=s3 && t<s4+0.2)?fio(t,s3+0.1,s4+0.2,0.3):0;
  $('phoneHand').setAttribute('opacity',hasPhone);
  const ph=armR*Math.PI/180; $('phoneHand').setAttribute('transform',`translate(${62+ -Math.sin(ph)*124+20*Math.cos(ph)},${-10+Math.cos(ph)*124+20*Math.sin(ph)}) rotate(${armR/3})`);
  $('basket').setAttribute('opacity', t<s3 ? 1 : 1-fin(t,s3,0.3));
  // thought bubble
  $('thought').setAttribute('opacity',fio(t,s2+0.15,s3-0.05,0.35));
  $('thought').setAttribute('transform',`translate(${860+(1-fin(t,s2+0.15,0.5))*40},${450+(1-fin(t,s2+0.15,0.5))*40}) scale(${0.85+0.15*fin(t,s2+0.15,0.5)})`);
  $('qmark').setAttribute('transform',`translate(0,${6*Math.sin(t*6)})`);
  // voice waves (she asks)
  const ask=fio(t,s3+0.05,s3+1.2,0.15);
  $('voice').setAttribute('opacity',ask);
  ['w1','w2','w3'].forEach((w,i)=>$(w).setAttribute('opacity', (Math.sin(t*12-i*1.2)+1)/2));
  // satellite
  const satIn=fin(t,s3+0.7,1.0);
  const satOut= t>s4 ? fin(t,s4,0.5):0;
  const sx=lerp(-200,820,satIn), sy=lerp(80,150,satIn)+10*Math.sin(t*1.5);
  $('sat').setAttribute('opacity',satIn*(1-satOut));
  $('sat').setAttribute('transform',`translate(${sx},${sy}) rotate(${-12+4*Math.sin(t)})`);
  const beam=fio(t,s3+1.6,s4,0.3);
  $('beams').setAttribute('opacity',beam);
  $('beams').setAttribute('stroke-dashoffset', -t*60);
  $('beam1').setAttribute('x1',sx);$('beam1').setAttribute('y1',sy+40);$('beam1').setAttribute('x2',600);$('beam1').setAttribute('y2',860);
  $('beam2').setAttribute('x1',sx);$('beam2').setAttribute('y1',sy+40);$('beam2').setAttribute('x2',1100);$('beam2').setAttribute('y2',880);
  $('data').setAttribute('opacity',fio(t,s3+3.6,s4,0.3));
  $('dRain').setAttribute('transform',`translate(470,${330+ (1-fin(t,s3+3.6,0.5))*30})`);
  $('dSoil').setAttribute('transform',`translate(470,${520+ (1-fin(t,s3+4.2,0.5))*30})`);
  $('dSoil').setAttribute('opacity',fin(t,s3+4.2,0.4));
  // phone UI
  const pin=fio(t,s4+0.1,s5,0.4);
  $('phone').setAttribute('opacity',pin);
  $('phone').setAttribute('transform',`translate(560,${520+(1-fin(t,s4+0.1,0.5))*80})`);
  const tapT=s4+1.4;
  $('finger').setAttribute('opacity',fio(t,s4+0.6,s4+2.6,0.3));
  const fk=eio((t-(s4+0.6))/0.8);
  $('finger').setAttribute('transform',`translate(${lerp(200,20,fk)},${lerp(60,-95,fk)})`);
  const tapped=t>=tapT;
  $('c2bg').setAttribute('fill',tapped?'#2E6A4C':'#FFFFFF'); $('c2t').setAttribute('fill',tapped?'#F5F0E6':'#4A5148');
  $('c2').setAttribute('transform',`translate(0,-105) scale(${tapped?1+0.08*Math.max(0,1-(t-tapT)/0.3):1})`);
  $('tapRing').setAttribute('opacity',tapped?Math.max(0,1-(t-tapT)/0.5):0);
  $('tapRing').setAttribute('r',10+80*cl((t-tapT)/0.5));
  $('reply').setAttribute('opacity',fin(t,s4+2.4,0.4));
  $('reply').setAttribute('transform',`translate(0,${160+(1-fin(t,s4+2.4,0.4))*30})`);
  // scene 5
  const s5on=fio(t,s5,s6,0.35);
  $('s5').setAttribute('opacity',s5on);
  $('tractor').setAttribute('transform',`translate(${470+lerp(-80,40,cl((t-s5)/2.4))},${640+3*Math.sin(t*20)})`);
  $('dollar').setAttribute('transform',`translate(170,${380+10*Math.sin(t*3)}) scale(${0.6+0.4*fin(t,s5+0.4,0.5)})`);
  const smallIn=fin(t,s5+2.6,0.5);
  $('small').setAttribute('opacity',smallIn);
  $('big').setAttribute('opacity',1-0.55*smallIn);
  SP5.forEach(([u,x,y],i)=>{const g=fin(t,s5+2.7+i*0.02,0.5);u.setAttribute('transform',`translate(${x},${y}) scale(${g})`);});
  const ang=t*0.9;
  [['f1',0],['f2',1],['f3',2],['f4',3]].forEach(([id,i])=>{
    const a=ang+i*Math.PI/2; const k=fin(t,s5+3.0+i*0.15,0.4);
    $(id).setAttribute('transform',`translate(${1440+320*Math.cos(a)},${560+110*Math.sin(a)}) scale(${k})`);
  });
  $('honest').setAttribute('opacity',fin(t,s5+4.5,0.4));
  $('honest').setAttribute('transform',`translate(1440,${290-(1-fin(t,s5+4.5,0.4))*20})`);
  // end card
  const en=fin(t,s6-0.15,0.45);
  $('end').setAttribute('opacity',en);
  $('endSprout').setAttribute('transform',`translate(960,430) scale(${3.2*fin(t,s6,0.6)})`);
  $('e1').setAttribute('opacity',fin(t,s6+0.1,0.4)); $('e2').setAttribute('opacity',fin(t,s6+1.3,0.4));
  $('e3').setAttribute('opacity',fin(t,s6+1.8,0.4)); $('e4').setAttribute('opacity',fin(t,s6+1.8,0.4));
  // overlays
  $('tag').setAttribute('opacity',fio(t,0.2,s2-0.2,0.4));
  $('fact').setAttribute('opacity',fio(t,4.1,s2-0.2,0.4));
  $('fact').setAttribute('transform',`translate(${110-(1-fin(t,4.1,0.4))*40},200)`);
  sub(t);
}
window.render=render; window.setSubs=setSubs;
</script>
</body></html>
