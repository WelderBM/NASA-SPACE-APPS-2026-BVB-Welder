<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente da roça — demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b141a;color:#e9edef;font:15px/1.5 system-ui,-apple-system,sans-serif;
     display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:1040px;display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.phone{background:#0b141a;border:1px solid #1f2c33;border-radius:14px;display:flex;
       flex-direction:column;height:84vh;min-height:520px;overflow:hidden}
.bar{background:#1f2c33;padding:11px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.av{width:34px;height:34px;border-radius:50%;background:#00a884;display:grid;place-items:center;font-size:17px}
.bar b{font-weight:600;font-size:15px}.bar small{color:#8696a0;display:block;font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;
      background:#0b141a}
.b{max-width:85%;padding:8px 11px;border-radius:9px;white-space:pre-wrap;word-break:break-word}
.them{background:#1f2c33;align-self:flex-start;border-top-left-radius:2px}
.me{background:#005c4b;align-self:flex-end;border-top-right-radius:2px}
.meta{font-size:11.5px;color:#8696a0;align-self:center;text-align:center;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;flex:0 0 auto;border-top:1px solid #1f2c33}
.chip{background:#1f2c33;color:#e9edef;border:1px solid #2a3942;border-radius:14px;
      padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{background:#2a3942}.chip.on{background:#005c4b;border-color:#00a884}
.dig span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8696a0;margin:0 2px;animation:d 1.2s infinite}
.dig span:nth-child(2){animation-delay:.2s}.dig span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.hora{font-size:10.5px;color:#8696a0;margin-left:7px;float:right;margin-top:3px}
.prow{display:flex;gap:6px;align-items:center;padding:7px 14px 0;flex-wrap:wrap;font-size:12px;color:#8696a0}
.row{display:flex;gap:8px;padding:10px 14px;flex:0 0 auto;background:#1f2c33;align-items:center}
.row input{flex:1;background:#2a3942;border:0;color:#e9edef;padding:10px 13px;border-radius:18px;
           font:inherit;outline:none}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:#00a884;color:#0b141a;
    font-size:17px;cursor:pointer;flex:0 0 auto}
.ic:disabled{background:#2a3942;color:#8696a0;cursor:not-allowed}
.ic.rec{background:#e24b4a;color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.55}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:#111b21;border:1px solid #1f2c33;border-radius:12px;padding:13px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#8696a0;
         font-weight:600;margin-bottom:9px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px;
    border-bottom:1px solid #18242b}
.kv:last-child{border:0}.kv span:last-child{color:#8bd5bd;text-align:right;font-variant-numeric:tabular-nums}
.lab{font-size:11px;color:#8696a0;margin:9px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.diag{font-size:11.5px;color:#8696a0;line-height:1.7}
.ok{color:#8bd5bd}.no{color:#f09595}
.note{font-size:12px;color:#8696a0;padding:0 2px}
select{width:100%;background:#2a3942;color:#e9edef;border:1px solid #2a3942;border-radius:7px;
       padding:7px 9px;font:inherit;margin-top:3px}
</style>
</head>
<body>
<div class="app">
  <div class="phone">
    <div class="bar"><div class="av">🌱</div>
      <div><b>Assistente da roça</b><small id="sub">carregando…</small></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="prow"><span>o que você quer:</span><span id="prios"></span></div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="ic" id="mic" title="falar">🎤</button>
      <input id="txt" placeholder="escreva ou aperte o microfone" autocomplete="off">
      <button class="ic" id="send">↑</button>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h3>Configuração</h3>
      <div class="lab">Lugar</div>
      <select id="lugar"></select>
      <div class="lab">O que acabou de colher</div>
      <select id="colheu"></select>
      <p class="note" id="regnote" style="margin-top:9px"></p>
      <div class="lab">Voz</div>
      <select id="voz"></select>
      <div class="lab">Velocidade <span id="rlab" style="color:#8bd5bd">0.98</span></div>
      <input type="range" id="rate" min="0.75" max="1.25" step="0.01" value="0.98" style="width:100%">
      <button class="chip" id="provar" style="margin-top:7px">ouvir uma frase</button>
    </div>
    <div class="card">
      <h3>O dado por trás</h3>
      <div id="dados"><p class="note">Faça uma pergunta para ver os números.</p></div>
    </div>
    <div class="card">
      <h3>Este navegador</h3>
      <div class="diag" id="diag">testando…</div>
    </div>
  </div>
</div>
<script>
const PRIOS={solo:'a terra melhorar',risco:'arriscar pouco',comida:'comida em casa',pasto:'pasto pro gado'};
const INTENT=[
 ['estado-do-solo',['a terra ta','a terra esta','como ta a terra','como esta a terra','terra boa',
   'terra seca','ta seco','esta seco','molhad','umidade','como ta o solo','da pra mexer na terra','terra fraca']],
 ['vai-chover',['vai chover','previs','semana que vem','amanha','chove','vai dar chuva','quando chove','tem chuva']],
 ['e-se',['e se','sera que','posso plantar','posso botar','da pra plantar','da pra botar','que tal','e o ','vale a pena']],
 ['riscos',['pode dar errado','risco','perigo','errado','problema','atrapalh','o que pode']],
 ['proximo-plantio',['colhi','tirei','arranquei','acabei de','terminei','o que planto','o que plantar',
   'o que vem','depois d','que eu boto','que planta agora','me indica','o que voce faria','o que fazer']],
];
let DB=null,st={lugar:null,colheu:null,prio:'risco',falar:true,ultima:null,voz:null,rate:0.98,ctx:'inicio'};
const $=i=>document.getElementById(i), msgs=$('msgs');

function agora(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function diz(t,quem='them',meta){
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=t;msgs.appendChild(m);}
  else{const d=document.createElement('div');d.className='b '+quem;d.textContent=t;
       const h=document.createElement('span');h.className='hora';h.textContent=agora();
       d.appendChild(h);msgs.appendChild(d);}
  msgs.scrollTop=msgs.scrollHeight;
}
function digitando(){
  const d=document.createElement('div');d.className='b them dig';
  d.innerHTML='<span></span><span></span><span></span>';
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;
}
// o motor manda VARIAS redacoes da mesma resposta. aqui sorteia sem repetir a
// ultima, pra ele nao ouvir a mesma frase duas vezes seguidas.
const _ult={};
function escolhe(r,chave){
  const fs=(r&&r.falas&&r.falas.length)?r.falas:[r&&r.fala].filter(Boolean);
  if(!fs.length)return '';if(fs.length===1)return fs[0];
  const livres=fs.filter(x=>x!==_ult[chave]);
  const e=livres[Math.floor(Math.random()*livres.length)]||fs[0];
  _ult[chave]=e;return e;
}
function nota(v){
  const n=(v.name||'').toLowerCase();let s=0;
  if(/pt[-_]br/i.test(v.lang))s+=100;else if(/^pt/i.test(v.lang))s+=50;else return -1;
  if(n.includes('google'))s+=40;            // a melhor no Chrome
  if(n.includes('natural'))s+=35;           // vozes neurais da Microsoft
  if(n.includes('online'))s+=10;
  if(v.localService===false)s+=15;          // voz de nuvem soa melhor que SAPI
  if(/\b(maria|daniel)\b/.test(n))s-=8;     // SAPI5 antiga, a mais robotica
  return s;
}
const vozes=()=>('speechSynthesis'in window)
  ? speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)).sort((a,b)=>nota(b)-nota(a)) : [];
function fala(t){
  if(!st.falar||!('speechSynthesis'in window))return;
  try{
    speechSynthesis.cancel();
    (t.match(/[^.!?]+[.!?]*/g)||[t]).map(p=>p.trim()).filter(Boolean).forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);
      const perg=/\?\s*$/.test(p);
      u.lang='pt-BR';u.volume=1;
      if(st.voz)u.voice=st.voz;
      // a Web Speech nao tem SSML, entao a entonacao sai daqui: pergunta sobe no
      // fim, afirmacao desce, e cada frase varia um fio. tudo no mesmo tom e
      // metade do que faz soar de robo.
      u.pitch=perg?1.14:(i===0?1.04:0.98);
      u.rate=st.rate*(perg?1.05:1)+(i%2?0.02:-0.02);
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function responde(t,r,ctx){
  const d=digitando();
  setTimeout(()=>{d.remove();diz(t);fala(t);
    if(r!==undefined)painel(r);
    if(ctx)chips(ctx);},Math.min(1500,420+t.length*11));
}

function classifica(s){
  const n=s.toLowerCase();
  for(const[id,ks]of INTENT) if(ks.some(k=>n.includes(k))) return id;
  return null;
}
function achaCultura(s){
  const n=s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const L=DB.lugares[st.lugar];
  for(const c of L.culturas){
    const a=c.replace(/-/g,' '),b=(DB.nomes_culturas[c]||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(' (')[0];
    if(n.includes(a)||n.includes(c)||(b&&n.includes(b)))return c;
  }
  return null;
}
function painel(r){
  const d=$('dados');
  if(!r){d.innerHTML='<p class="note">Sem números para essa resposta.</p>';return;}
  const e=r.estado_observado||{},o=(r.opcoes||[])[0];
  let h=`<div class="lab">Observado, ${e.mes||''}</div>`;
  h+=kv('Chuva normal do mês',(e.chuva_normal_do_mes_mm??'—')+' mm');
  if(e.solo_raiz)h+=kv('Umidade da raiz',e.solo_raiz.observado+' (normal '+e.solo_raiz.normal+')');
  if(e.fator_do_ano)h+=kv('O ano até aqui',Math.round(e.fator_do_ano.razao*100)+'% do normal');
  h+=kv('Estiagem normal do mês',(e.veranico_normal_do_mes_dias??'—')+' dias');
  if(o){
    h+=`<div class="lab">${o.cultura}</div>`;
    h+=kv('Encaixe com o que ele quer',o.encaixe??'—');
    h+=kv('Confiança no dado',Math.round(o.confianca*100)+'%');
    if(o.risco&&o.risco.agua&&o.risco.agua.razao!=null)
      h+=kv('Água',o.risco.agua.nivel+' ('+o.risco.agua.razao+'× de '+o.risco.agua.exige_mm+' mm)');
    if(o.risco&&o.risco.chuva_ajustada_mm!=null)
      h+=kv('Chuva da janela, ajustada',o.risco.chuva_ajustada_mm+' mm');
    if(o.nao_sei&&o.nao_sei.length)h+=`<div class="lab">Não sabemos</div><p class="diag">${o.nao_sei.join('<br>')}</p>`;
  }
  if(r.sei_pouco&&r.sei_pouco.length)
    h+=`<div class="lab">Sei a parentada, não o ciclo</div><p class="diag">${r.sei_pouco.map(s=>s.cultura).join(', ')}</p>`;
  if(r.limites&&r.limites.length)h+=`<div class="lab">Limites</div><p class="diag">${r.limites.join('<br>')}</p>`;
  d.innerHTML=h;
}
const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`;

function mostraRiscos(){
  if(!st.ultima)st.ultima=DB.lugares[st.lugar].proximo_plantio[st.colheu][st.prio];
  const r=st.ultima;
  if(!r||!(r.opcoes||[]).length){
    responde('Dessa eu não tenho número pra te dar. Me diz primeiro o que você colheu.',undefined,'inicio');return;}
  const o=r.opcoes[0],p=[];
  if(o.avisos&&o.avisos.length)p.push(o.avisos.join('. '));
  if(o.nao_sei&&o.nao_sei.length)p.push('E tem coisa que eu não sei: '+o.nao_sei[0]);
  responde(p.length?p.join('. ')+'.':'Nessa eu não vi problema com a chuva do período.',r,'risco');
}
function perguntaProximo(){
  const r=DB.lugares[st.lugar].proximo_plantio[st.colheu][st.prio];
  st.ultima=r;responde(escolhe(r,'ind-'+st.colheu+st.prio),r,'indicacao');
}
function perguntaESe(hip){
  const r=(DB.lugares[st.lugar].e_se[st.colheu]||{})[hip];
  if(!r){responde('Essa eu não conheço aqui nesse lugar.',undefined,'inicio');return;}
  st.ultima=r;responde(escolhe(r,'ese-'+st.colheu+hip),r,'hipotese');
}
function trata(s){
  diz(s,'me');
  const id=classifica(s),cult=achaCultura(s),L=DB.lugares[st.lugar];
  if(id==='estado-do-solo'){const r=L.estado_do_solo;st.ultima=st.ultima||r;
    responde(escolhe(r,'terra'),r,'terra');return;}
  if(id==='vai-chover'){const r=L.vai_chover;responde(escolhe(r,'chuva'),r,'chuva');return;}
  if(id==='riscos'){mostraRiscos();return;}
  if(id==='e-se'){
    if(cult){perguntaESe(cult);return;}
    // texto de esclarecimento, nao de agronomia: isso a pagina pode escrever
    responde('Plantar o quê? Me diz o nome que eu te falo.',undefined,'inicio');return;}
  if(id==='proximo-plantio'||cult){
    if(cult){st.colheu=cult;$('colheu').value=cult;}
    perguntaProximo();return;}
  responde('Não peguei. Me diz o que você acabou de colher, ou pergunta "e se eu plantar milho".',undefined,'inicio');
}

function chips(ctx){
  st.ctx=ctx||st.ctx||'inicio';
  const c=$('chips');c.innerHTML='';
  const add=(t,f)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=f;c.appendChild(b)};
  const L=DB.lugares[st.lugar];
  const outra=()=>{const v=L.culturas.filter(x=>x!==st.colheu);return v[Math.floor(Math.random()*v.length)]};
  const set={
    inicio:    [['colhi '+nome(st.colheu),()=>trata('colhi '+nome(st.colheu))],
                ['a terra tá boa?',()=>trata('a terra tá boa?')]],
    indicacao: [['o que pode dar errado?',()=>{diz('o que pode dar errado?','me');mostraRiscos()}],
                ['e se eu plantar '+nome(outra()),null],
                ['a terra tá boa?',()=>trata('a terra tá boa?')]],
    risco:     [['e se eu plantar '+nome(outra()),null],
                ['vai chover?',()=>trata('vai chover semana que vem?')]],
    hipotese:  [['então o que você faria?',()=>trata('o que você faria?')],
                ['o que pode dar errado?',()=>{diz('o que pode dar errado?','me');mostraRiscos()}]],
    terra:     [['o que eu planto agora?',()=>trata('o que eu planto agora?')],
                ['vai chover?',()=>trata('vai chover semana que vem?')]],
    chuva:     [['o que eu planto agora?',()=>trata('o que eu planto agora?')],
                ['a terra tá boa?',()=>trata('a terra tá boa?')]],
  }[st.ctx]||[];
  set.forEach(([t,f])=>add(t,f||(()=>trata(t))));
  add(st.falar?'🔊 voz':'🔇 sem voz',()=>{st.falar=!st.falar;if(!st.falar)speechSynthesis.cancel();chips()});
}
const nome=c=>(DB.nomes_culturas[c]||c).split(' (')[0].toLowerCase();

function prios(){
  const p=$('prios');p.innerHTML='';
  for(const[k,v]of Object.entries(PRIOS)){
    const b=document.createElement('button');
    b.className='chip'+(k===st.prio?' on':'');b.textContent=v;
    b.onclick=()=>{if(k===st.prio)return;st.prio=k;prios();
      diz('agora é '+v,'me');perguntaProximo()};
    p.appendChild(b);
  }
}
function trocaLugar(){
  const L=DB.lugares[st.lugar];st.colheu=L.culturas[0];
  const s=$('colheu');s.innerHTML='';
  L.culturas.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=nome(c);s.appendChild(o)});
  $('sub').textContent=L.nome+' · plantio em '+L.estado.mes;
  $('regnote').textContent=L.registro==='local'
    ? 'Fala no registro local, com as palavras dos produtores que responderam o formulário.'
    : 'Sem vocabulário levantado para este lugar: o motor cai em português neutro e declara isso.';
  msgs.innerHTML='';
  diz(L.nome+' · mesmo motor, mesmo código',null,true);
  responde('Bom dia. Me diz o que você acabou de colher que eu te digo o que eu plantaria agora.',undefined,'inicio');
  prios();
}

// microfone: so o ESCUTAR precisa de permissao. o FALAR funciona sempre.
let rec=null,gravando=false;
function micInit(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('mic').disabled=true;$('mic').title='este navegador não escuta';return;}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=e=>{const t=e.results[0][0].transcript;trata(t)};
  rec.onerror=e=>{
    const m={'not-allowed':'permissão do microfone negada','service-not-allowed':'serviço de fala bloqueado',
             'no-speech':'não ouvi nada','audio-capture':'nenhum microfone encontrado',
             'network':'o reconhecimento precisa de internet'}[e.error]||e.error;
    diz('Microfone: '+m+'. Pode escrever.',null,true);
    $('diag').insertAdjacentHTML('beforeend','<br><span class="no">erro do microfone: '+e.error+'</span>');
  };
  rec.onend=()=>{gravando=false;$('mic').classList.remove('rec')};
  $('mic').onclick=()=>{
    if(gravando){rec.stop();return}
    try{speechSynthesis.cancel();rec.start();gravando=true;$('mic').classList.add('rec')}
    catch(e){diz('Não consegui abrir o microfone: '+e.message,null,true)}
  };
}
function diag(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const l=[['escutar (SpeechRecognition)',!!SR],['falar (speechSynthesis)','speechSynthesis'in window],
           ['microfone (getUserMedia)',!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)],
           ['contexto seguro (https)',window.isSecureContext],['fora de iframe',window.self===window.top]];
  $('diag').innerHTML=l.map(([k,v])=>`<span class="${v?'ok':'no'}">${v?'✓':'✗'}</span> ${k}`).join('<br>')
    +'<br><span class="ok">vozes pt-BR: '+(('speechSynthesis'in window)?speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)).length:0)+'</span>';
}
$('send').onclick=()=>{const v=$('txt').value.trim();if(v){$('txt').value='';trata(v)}};
$('txt').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
$('lugar').onchange=e=>{st.lugar=e.target.value;trocaLugar()};
$('colheu').onchange=e=>{st.colheu=e.target.value;perguntaProximo()};
function montaVozes(){
  const sel=$('voz'),vs=vozes();
  if(!vs.length){sel.innerHTML='<option>nenhuma voz em português</option>';return}
  const atual=st.voz&&st.voz.name;
  sel.innerHTML='';
  vs.forEach((v,i)=>{const o=document.createElement('option');o.value=v.name;
    o.textContent=v.name+(i===0?'  ← melhor':'');sel.appendChild(o)});
  st.voz=vs.find(v=>v.name===atual)||vs[0];sel.value=st.voz.name;
}
$('voz').onchange=e=>{st.voz=vozes().find(v=>v.name===e.target.value)||null};
$('rate').oninput=e=>{st.rate=parseFloat(e.target.value);$('rlab').textContent=st.rate.toFixed(2)};
$('provar').onclick=()=>{const g=st.falar;st.falar=true;
  fala('Depois da mandioca, eu iria de feijão-caupi. Deixa a terra mais forte pro que vem depois. Quer saber o que pode dar errado?');st.falar=g};
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{diag();montaVozes()};

fetch('./dados/respostas.json').then(r=>r.json()).then(db=>{
  DB=db;const s=$('lugar');
  Object.entries(db.lugares).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.nome;s.appendChild(o)});
  st.lugar=Object.keys(db.lugares)[0];trocaLugar();micInit();diag();montaVozes();
}).catch(e=>{$('sub').textContent='erro ao carregar';diz('Não consegui carregar as respostas do motor: '+e.message,null,true)});
</script>
</body>
</html>
